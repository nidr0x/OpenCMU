name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Smoke tests
        run: make test

      - name: ShellCheck (every script, POSIX mode)
        run: find . -name '*.sh' -not -path './dist/*' -print0 | sort -z | xargs -0 shellcheck -s sh

      - name: Build USB payload and verify it
        run: |
          make dist
          sh builder/verify-usb.sh dist/opencmu-usb
          # The tweak count is not hardcoded: it is the number of tweaks in the tree.
          [ "$(sh installer/install.sh --usb . --root /nonexistent --list | grep -c .)" = "$(find tweaks -name tweak.env | wc -l | tr -d ' ')" ]
